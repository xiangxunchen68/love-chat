<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="勳貝的家">
<meta name="theme-color" content="#ff8fa3">
<title>勳貝的家</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --pink:#ff8fa3; --pink-d:#f06a85; --bg:#fff5f7; --other:#ffffff; --mine:#ffd6de; --text:#3a2a2e; --muted:#a08a90; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; }
  body { display:flex; flex-direction:column; height:100dvh; }
  [hidden] { display:none !important; }

  /* 登入 */
  #login { margin:auto; width:min(320px,90vw); text-align:center; }
  #login h1 { font-size:28px; margin-bottom:24px; }
  #login input { width:100%; padding:12px; margin:6px 0; border:1px solid #f3c2cc; border-radius:12px; font-size:16px; }
  #login button { width:100%; padding:12px; margin-top:10px; border:0; border-radius:12px; background:var(--pink); color:#fff; font-size:16px; }
  #loginErr { color:#d33; font-size:14px; min-height:20px; }

  /* 聊天 */
  #app { display:flex; flex-direction:column; height:100%; }
  header { display:flex; align-items:center; gap:6px; padding:10px 12px; padding-top:max(10px,env(safe-area-inset-top));
    background:var(--pink); color:#fff; }
  header .title { font-weight:700; font-size:17px; white-space:nowrap; }
  header .days { font-size:12px; opacity:.9; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header button { background:rgba(255,255,255,.25); color:#fff; border:0; border-radius:10px; padding:6px 9px; font-size:15px; }

  #pin { display:flex; align-items:center; gap:8px; background:#fff; padding:8px 14px; font-size:14px; border-bottom:1px solid #f6d5dc; cursor:pointer; }
  #pin span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #pin button, #replyBar button { background:none; border:0; font-size:16px; color:var(--muted); }

  #list { flex:1; overflow-y:auto; padding:12px 10px; -webkit-overflow-scrolling:touch; }
  .row { display:flex; align-items:flex-end; gap:6px; margin:6px 0; }
  .row.mine { flex-direction:row-reverse; }
  .bubble { max-width:72%; padding:9px 12px; border-radius:18px; background:var(--other); white-space:pre-wrap; word-break:break-word;
    font-size:16px; line-height:1.4; box-shadow:0 1px 2px rgba(0,0,0,.05);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .mine .bubble { background:var(--mine); }
  .bubble .q { font-size:13px; color:var(--muted); border-left:3px solid var(--pink); padding:2px 8px; margin-bottom:6px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; cursor:pointer; }
  .bubble.sticker { background:none; box-shadow:none; font-size:56px; padding:0; line-height:1.1; }
  .bubble.stkimg { background:none; box-shadow:none; padding:0; }
  .bubble.stkimg img { width:120px; height:120px; object-fit:contain; display:block; border-radius:14px; }
  .bubble.photo { padding:3px; }
  .bubble.photo img { display:block; max-width:100%; max-height:320px; border-radius:15px; cursor:zoom-in; }
  .bubble.filemsg { cursor:pointer; }
  .fn { font-weight:600; } .fs { font-size:12px; color:var(--muted); }
  .meta { font-size:11px; color:var(--muted); display:flex; flex-direction:column; align-items:flex-end; white-space:nowrap; }
  .row:not(.mine) .meta { align-items:flex-start; }
  .read { color:var(--pink-d); }
  .row.picked .bubble { outline:3px solid var(--pink); outline-offset:2px; }

  #replyBar { display:flex; align-items:center; gap:8px; background:#fff; padding:8px 12px; font-size:13px; color:var(--muted); border-top:1px solid #f6d5dc; }
  #replyBar span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  footer { display:flex; align-items:flex-end; gap:4px; padding:8px; padding-bottom:max(8px,env(safe-area-inset-bottom));
    background:#fff; border-top:1px solid #f6d5dc; }
  footer .icon { font-size:23px; background:none; border:0; padding:4px 3px; cursor:pointer; line-height:1; }
  #input { flex:1; min-width:0; resize:none; border:1px solid #f3c2cc; border-radius:18px; padding:8px 12px; font-size:16px; max-height:120px; font-family:inherit; }
  #send { background:var(--pink); color:#fff; border:0; border-radius:18px; padding:9px 13px; font-size:15px; white-space:nowrap;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }

  #stickers { background:#fff; border-top:1px solid #f6d5dc; max-height:44vh; display:flex; flex-direction:column; }
  .stkTabs { display:flex; gap:6px; overflow-x:auto; padding:6px 8px; border-bottom:1px solid #f6d5dc; flex-shrink:0; }
  .stkTabs button { flex-shrink:0; display:flex; align-items:center; gap:4px; background:#f7f0f2; border:0; border-radius:14px;
    padding:4px 10px; font-size:13px; color:var(--text); white-space:nowrap; }
  .stkTabs button.on { background:var(--pink); color:#fff; }
  .stkTabs button.add { background:#fff; color:var(--muted); border:1px dashed #f3c2cc; }
  .stkTabs img { width:22px; height:22px; object-fit:contain; }
  .stkGrid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:8px; overflow-y:auto; }
  .stkGrid button { background:none; border:0; padding:2px; font-size:32px; }
  .stkGrid img { width:100%; aspect-ratio:1; object-fit:contain; display:block; }
  .stkEmpty { grid-column:1/-1; text-align:center; color:var(--muted); font-size:14px; }

  #viewer { position:fixed; inset:0; background:rgba(0,0,0,.9); display:flex; align-items:center; justify-content:center; z-index:9; }
  #viewer img { max-width:100%; max-height:100%; }
  #vBar { position:absolute; left:0; right:0; bottom:max(20px,env(safe-area-inset-bottom)); display:flex; justify-content:center; align-items:center; gap:12px; color:#fff; font-size:13px; }
  #vDl { background:rgba(255,255,255,.9); color:#333; border:0; border-radius:16px; padding:8px 16px; font-size:14px; }

  /* 確認視窗 */
  .cfm { position:fixed; inset:0; z-index:11; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; }
  .cfmBox { background:#fff; border-radius:16px; padding:20px; width:min(300px,85vw); text-align:center; }
  .cfmBox p { margin:0 0 16px; font-size:17px; line-height:1.5; }
  .cfmBox div { display:flex; gap:10px; }
  .cfmBox button { flex:1; padding:11px; border:0; border-radius:12px; font-size:16px; }
  .cfmBox .c { background:#eee; color:#333; } .cfmBox .o { background:var(--pink); color:#fff; }

  /* 通話 */
  #call { position:fixed; inset:0; z-index:8; background:linear-gradient(160deg,var(--pink),#c56cf0); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #remoteV { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000; }
  #localV { position:absolute; right:12px; top:max(12px,env(safe-area-inset-top)); width:28vw; max-width:160px;
    border-radius:12px; object-fit:cover; transform:scaleX(-1); }
  #call.audio #remoteV, #call.audio #localV { visibility:hidden; }
  #call.video .callInfo { position:absolute; top:max(16px,env(safe-area-inset-top)); left:16px; text-align:left; }
  #call.video .heart { display:none; }
  .callInfo { position:relative; text-align:center; text-shadow:0 1px 3px rgba(0,0,0,.3); }
  .heart { font-size:80px; margin-bottom:12px; }
  #callStatus { font-size:20px; } #callTimer { font-size:16px; opacity:.9; margin-top:4px; }
  .callBtns { position:absolute; bottom:max(40px,env(safe-area-inset-bottom)); display:flex; gap:22px; }
  .callBtns button { width:64px; height:64px; border-radius:50%; border:0; font-size:24px; color:#fff; background:rgba(255,255,255,.3); }
  .callBtns button.off { background:rgba(0,0,0,.45); }
  .callBtns .ok { background:#34c759; font-size:16px; } .callBtns .no { background:#ff3b30; font-size:16px; }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:rgba(0,0,0,.75); color:#fff;
    padding:8px 14px; border-radius:12px; font-size:14px; z-index:12; }
</style>
</head>
<body>

<div id="login" hidden>
  <h1>💕 勳貝的家</h1>
  <input id="email" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="密碼" autocomplete="current-password">
  <button id="loginBtn">登入</button>
  <p id="loginErr"></p>
</div>

<div id="app" hidden>
  <header>
    <span class="title">💕 勳貝的家</span>
    <span class="days" id="days"></span>
    <button id="callA" title="語音通話">📞</button>
    <button id="callV" title="視訊通話">📹</button>
    <button id="menuBtn" title="選單">☰</button>
  </header>
  <div id="pin" hidden><span id="pinText"></span><button id="pinX" title="取消公告">✕</button></div>
  <main id="list"></main>
  <div id="replyBar" hidden><span id="replyText"></span><button id="replyX" title="取消回覆">✕</button></div>
  <div id="stickers" hidden></div>
  <footer>
    <label class="icon" title="照片/影片">📷<input type="file" accept="image/*,video/*" id="file" multiple hidden></label>
    <label class="icon" title="檔案">📎<input type="file" id="anyFile" hidden></label>
    <button class="icon" id="stkBtn" title="貼圖">😊</button>
    <textarea id="input" rows="1" placeholder="說點什麼…"></textarea>
    <button id="send" title="長按可以悄悄傳送">送出</button>
  </footer>
</div>

<div id="call" hidden>
  <video id="remoteV" autoplay playsinline></video>
  <video id="localV" autoplay playsinline muted></video>
  <div class="callInfo"><div class="heart">💕</div><div id="callStatus"></div><div id="callTimer"></div></div>
  <div class="callBtns">
    <button id="muteBtn" title="靜音">🎙️</button>
    <button id="camBtn" title="鏡頭開關">📷</button>
    <button id="acceptBtn" class="ok">接聽</button>
    <button id="hangBtn" class="no">掛斷</button>
  </div>
</div>

<div id="viewer" hidden><img alt=""><div id="vBar"><span id="vInfo"></span><button id="vDl" hidden>下載原圖</button></div></div>
<div id="toast" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, limitToLast,
         onSnapshot, doc, setDoc, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===================== 設定 ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyDbdltzrwvdcQ_F_zqbLY72WAUSOf5SAkY",
  authDomain: "our-love-chat-5e859.firebaseapp.com",
  projectId: "our-love-chat-5e859",
  storageBucket: "our-love-chat-5e859.firebasestorage.app",
  messagingSenderId: "921889088609",
  appId: "1:921889088609:web:676ca37729d15175437620"
};
// 在一起的日期（之後可以在「設定」裡改）
const START_DATE = "2025-10-09";
// 內建貼圖
const STICKERS = [];   // 內建的 emoji 貼圖已拿掉，只用自己上傳的表情包
// 通話連不上時再加 TURN 伺服器
const TURN_SERVERS = [];
// 主題顏色：主色、深色、我的泡泡、背景
const COLORS = [
  ["#ff8fa3", "#f06a85", "#ffd6de", "#fff5f7"],
  ["#7ab8ff", "#4a90e2", "#d6e8ff", "#f4f8ff"],
  ["#b18cff", "#8a5cf0", "#e6dcff", "#f8f5ff"],
  ["#5cc98f", "#34a86f", "#d3f2e1", "#f3fbf6"],
  ["#ffb067", "#f08a2c", "#ffe3c9", "#fff8f1"]
];
/* ================================================ */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

// ---------- 顏色與天數 ----------
function applyColor(i) {
  const c = COLORS[i] || COLORS[0];
  const r = document.documentElement.style;
  r.setProperty("--pink", c[0]); r.setProperty("--pink-d", c[1]); r.setProperty("--mine", c[2]); r.setProperty("--bg", c[3]);
  document.querySelector('meta[name="theme-color"]').content = c[0];
  try { localStorage.setItem("color", String(i)); } catch {}
}
try { const ci = localStorage.getItem("color"); if (ci !== null) applyColor(Number(ci)); } catch {}

let startDate = START_DATE;
function showDays(s) {
  startDate = s;
  const n = Math.floor((Date.now() - new Date(s + "T00:00:00")) / 86400000) + 1;
  $("days").textContent = n > 0 ? "在一起第 " + n + " 天" : "";
}
showDays(START_DATE);

// ---------- 小工具 ----------
let tt;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2000);
}
function confirmBox(text, okText, onOk) {
  const w = document.createElement("div"); w.className = "cfm";
  const box = document.createElement("div"); box.className = "cfmBox";
  const p = document.createElement("p"); p.textContent = text;
  const row = document.createElement("div");
  const c = document.createElement("button"); c.className = "c"; c.textContent = "取消";
  const o = document.createElement("button"); o.className = "o"; o.textContent = okText;
  row.append(c, o); box.append(p, row); w.append(box);
  c.onclick = () => w.remove();
  w.onclick = e => { if (e.target === w) w.remove(); };
  o.onclick = () => { w.remove(); onOk(); };
  document.body.appendChild(w);
}
// 看照片：先顯示小圖，有原圖的話再換成原圖，可以下載
let viewToken = 0;
async function view(src, orig) {
  const v = $("viewer"), im = v.querySelector("img"), tok = ++viewToken;
  im.src = src; v.hidden = false; $("vDl").hidden = true; $("vInfo").textContent = "";
  if (!orig || !window.LCX) return;
  $("vInfo").textContent = "載入原圖中…";
  try {
    const url = await window.LCX.getBlobUrl(orig, true);
    if (tok !== viewToken || v.hidden) return;
    im.src = url;
    $("vInfo").textContent = "原圖 " + (orig.size > 1048576 ? (orig.size / 1048576).toFixed(1) + " MB" : Math.round(orig.size / 1024) + " KB");
    $("vDl").hidden = false;
    $("vDl").onclick = e => {
      e.stopPropagation();
      const a = document.createElement("a"); a.href = url; a.download = orig.name || "photo.jpg";
      document.body.append(a); a.click(); a.remove();
    };
  } catch { if (tok === viewToken) $("vInfo").textContent = "原圖載入失敗"; }
}
$("viewer").onclick = e => { if (e.target.id === "vDl") return; $("viewer").hidden = true; viewToken++; };

// 聊天背景（存在共用設定裡，兩個人一起變）
let bgData = null, bgFade = 0.45;
function applyBg(bg, fade) {
  bgData = bg || null;
  if (fade !== undefined && fade !== null) bgFade = fade;
  const l = $("list");
  if (!bgData) { l.style.backgroundImage = ""; return; }
  const ov = "rgba(255,255,255," + bgFade + ")";
  l.style.backgroundImage = "linear-gradient(" + ov + "," + ov + "),url(\"" + bgData + "\")";
  l.style.backgroundSize = "auto, 450px auto";
  l.style.backgroundRepeat = "repeat";
  l.style.backgroundAttachment = "local";
}

// ---------- 登入 ----------
$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pw").value); }
  catch (e) { $("loginErr").textContent = "登入失敗，請檢查帳號密碼"; }
};
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });

let me = null, unsubs = [];
onAuthStateChanged(auth, user => {
  unsubs.forEach(u => u()); unsubs = [];
  me = user;
  $("login").hidden = !!user;
  $("app").hidden = !user;
  document.querySelectorAll(".panel,.sheet").forEach(p => p.remove());
  if (user) startChat();
});

// ---------- 聊天 ----------
const list = $("list");
const els = new Map();       // 訊息 id -> 畫面元素
const msgs = new Map();      // 訊息 id -> 資料
const hidden = new Set();    // 我刪除（隱藏）的訊息
let otherReadAt = 0, myReadWritten = 0, latestOther = 0, firstLoad = true;
let replyTo = null, pin = null, customStk = [], nick = "";

// 對方的暱稱（只有自己看得到，在「設定」裡改）
const who = uid => (me && uid === me.uid) ? "我" : (nick || "對方");
function refreshNames() {
  list.querySelectorAll(".q").forEach(q => { q.textContent = who(q.dataset.uid) + "：" + q.dataset.t; });
}
function preview(m) {
  if (m.text) return m.text;
  if (m.img) return "[照片]";
  if (m.stkImg) return "[貼圖]";
  if (m.sticker) return m.sticker;
  if (m.file) return m.file.type.startsWith("video/") ? "[影片]" : "[檔案] " + m.file.name;
  return "";
}

function fmt(ms) {
  const d = new Date(ms), now = new Date();
  const hm = d.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false });
  return d.toDateString() === now.toDateString() ? hm : (d.getMonth() + 1) + "/" + d.getDate() + " " + hm;
}

function makeRow(id, m) {
  const row = document.createElement("div");
  row.className = "row" + (m.uid === me.uid ? " mine" : "");
  row.dataset.id = id;
  const b = document.createElement("div");
  b.className = "bubble";
  if (m.reply) {
    const q = document.createElement("div"); q.className = "q";
    q.dataset.uid = m.reply.uid; q.dataset.t = m.reply.text;
    q.textContent = who(m.reply.uid) + "：" + m.reply.text;
    q.onclick = () => { const r = els.get(m.reply.id); if (r) r.scrollIntoView({ behavior: "smooth", block: "center" }); };
    b.appendChild(q);
  }
  if (m.img) {
    b.classList.add("photo");
    const img = new Image(); img.src = m.img; img.loading = "lazy";
    img.onclick = () => view(m.img, m.orig);
    b.appendChild(img);
  } else if (m.stkImg) {
    b.classList.add("stkimg");
    const img = new Image(); img.src = m.stkImg; b.appendChild(img);
  } else if (m.sticker) {
    b.classList.add("sticker"); b.append(m.sticker);
  } else if (m.file) {
    b.classList.add("filemsg");
    if (window.LCX) window.LCX.renderFile(b, m.file); else b.append("📄 " + m.file.name);
  } else {
    const t = document.createElement("div"); t.textContent = m.text; b.appendChild(t);   // 用 textContent，避免被塞奇怪的程式碼
  }
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML = '<span class="read"></span><span class="time"></span>';
  if (m.silent) meta.prepend("🤫");
  row.append(b, meta);

  // 長按（電腦是右鍵）打開訊息選單
  let t = null, sx = 0, sy = 0, fired = false;
  const open = () => { fired = true; if (!list.classList.contains("selecting") && window.LCX) window.LCX.msgMenu(id); };
  b.addEventListener("pointerdown", e => { fired = false; sx = e.clientX; sy = e.clientY; clearTimeout(t); t = setTimeout(open, 500); });
  b.addEventListener("pointermove", e => { if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) clearTimeout(t); });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => b.addEventListener(ev, () => clearTimeout(t)));
  b.addEventListener("contextmenu", e => { e.preventDefault(); clearTimeout(t); if (!fired) open(); });
  b.addEventListener("click", e => { if (fired) { e.stopPropagation(); e.preventDefault(); fired = false; } }, true);
  return row;
}

function setTime(row, ms) {
  row.dataset.ts = ms;
  row.querySelector(".time").textContent = fmt(ms);
}

function refreshReads() {
  list.querySelectorAll(".row.mine").forEach(r => {
    r.querySelector(".read").textContent = Number(r.dataset.ts) <= otherReadAt ? "已讀" : "";
  });
}

function markRead(latestOtherMs) {
  if (document.visibilityState !== "visible" || latestOtherMs <= myReadWritten) return;
  myReadWritten = latestOtherMs;
  setDoc(doc(db, "reads", me.uid), { at: latestOtherMs }).catch(() => {});
}
document.addEventListener("visibilitychange", () => { if (me) markRead(latestOther); });

function startChat() {
  list.innerHTML = ""; els.clear(); msgs.clear(); firstLoad = true;
  const q = query(collection(db, "messages"), orderBy("ts"), limitToLast(500));
  unsubs.push(onSnapshot(q, snap => {
    const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 120;
    let ding = false, mineAdded = false;
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id;
      if (ch.type === "removed") { const r = els.get(id); if (r) r.remove(); els.delete(id); msgs.delete(id); return; }
      const m = ch.doc.data({ serverTimestamps: "estimate" });
      const ms = m.ts ? m.ts.toMillis() : Date.now();
      msgs.set(id, Object.assign({}, m, { id: id, ms: ms }));
      let row = els.get(id);
      if (!row) {
        row = makeRow(id, m); els.set(id, row);
        row.hidden = hidden.has(id);
        list.insertBefore(row, list.children[ch.newIndex] || null);
        if (!firstLoad && m.uid !== me.uid && !m.silent) ding = true;
        if (m.uid === me.uid) mineAdded = true;
      }
      setTime(row, ms);
      if (m.uid !== me.uid && ms > latestOther) latestOther = ms;
    });
    firstLoad = false;
    refreshReads();
    markRead(latestOther);
    if (ding) chime();
    if (nearBottom || mineAdded) list.scrollTop = list.scrollHeight;
  }, err => toast("讀取失敗：" + err.code)));

  // 對方的已讀
  unsubs.push(onSnapshot(collection(db, "reads"), snap => {
    snap.forEach(d => { if (d.id !== me.uid) otherReadAt = d.data().at || 0; });
    refreshReads();
  }));
  // 我刪除的訊息
  unsubs.push(onSnapshot(collection(db, "users", me.uid, "hidden"), snap => {
    hidden.clear(); snap.forEach(d => hidden.add(d.id));
    els.forEach((row, id) => { row.hidden = hidden.has(id); });
  }, () => {}));
  // 我自己的偏好：對方暱稱
  unsubs.push(onSnapshot(doc(db, "users", me.uid, "prefs", "main"), s => {
    nick = (s.data() || {}).nick || "";
    refreshNames();
  }, () => {}));
  // 共用設定：紀念日、顏色、公告
  unsubs.push(onSnapshot(doc(db, "settings", "main"), s => {
    const d = s.data() || {};
    if (d.start) showDays(d.start);
    if (d.color !== undefined && d.color !== null) applyColor(d.color);
    applyBg(d.bg || null, d.bgFade);
    pin = d.pin || null;
    $("pin").hidden = !pin;
    if (pin) $("pinText").textContent = "📢 " + pin.text;
  }, () => {}));
  // 自訂表情包
  unsubs.push(onSnapshot(query(collection(db, "stickers"), orderBy("ts")), s => {
    customStk = s.docs.map(d => Object.assign({ id: d.id }, d.data()));
    drawStickers();
  }, () => {}));
  // 來電
  unsubs.push(onSnapshot(query(collection(db, "calls"), where("status", "==", "ringing")), snap => {
    snap.docChanges().forEach(ch => {
      const d = ch.doc.data();
      if (ch.type === "added" && d.from !== me.uid && !call && Date.now() - d.ts < 45000) incoming(ch.doc.id, d);
      if (ch.type === "removed" && call && call.id === ch.doc.id && call.role === "incoming") endLocal("對方已取消");
    });
  }));
  setTimeout(() => list.scrollTop = list.scrollHeight, 300);
}

// 公告
$("pin").onclick = e => {
  if (e.target === $("pinX") || !pin) return;
  const r = els.get(pin.id); if (r) r.scrollIntoView({ behavior: "smooth", block: "center" });
};
$("pinX").onclick = () => confirmBox("要取消公告嗎？", "取消公告", () => setDoc(doc(db, "settings", "main"), { pin: null }, { merge: true }));

// 回覆
function setReply(id) {
  replyTo = msgs.get(id); if (!replyTo) return;
  $("replyText").textContent = "回覆 " + who(replyTo.uid) + "：" + preview(replyTo);
  $("replyBar").hidden = false;
  input.focus();
}
function clearReply() { replyTo = null; $("replyBar").hidden = true; }
$("replyX").onclick = clearReply;

async function send(data, opts) {
  opts = opts || {};
  const extra = {};
  if (replyTo && !opts.noReply) {
    extra.reply = { id: replyTo.id, uid: replyTo.uid, text: preview(replyTo).slice(0, 60) };
    clearReply();
  }
  if (opts.silent) extra.silent = true;
  try {
    await addDoc(collection(db, "messages"), Object.assign({}, data, extra, { uid: me.uid, ts: serverTimestamp() }));
    if (!opts.silent && window.LCX && window.LCX.notify) window.LCX.notify(preview(data));   // 通知對方手機
  }
  catch (e) { toast("傳送失敗：" + e.code); }
}

// 文字（長按「送出」= 悄悄傳送，對方不會有提示音）
const input = $("input");
function sendText(silent) {
  const t = input.value.trim();
  if (!t) return;
  input.value = ""; autoGrow();
  send({ text: t }, { silent: silent });
  if (silent) toast("🤫 已悄悄傳送");
}
let sendT = null, sendLong = false;
$("send").addEventListener("pointerdown", e => {
  e.preventDefault();   // 不讓鍵盤收起來
  sendLong = false; clearTimeout(sendT);
  sendT = setTimeout(() => { sendLong = true; sendText(true); }, 600);
});
["pointerup", "pointerleave", "pointercancel"].forEach(ev => $("send").addEventListener(ev, () => clearTimeout(sendT)));
$("send").addEventListener("contextmenu", e => e.preventDefault());
$("send").onclick = () => { if (sendLong) { sendLong = false; return; } sendText(false); };
input.addEventListener("keydown", e => {
  // 電腦上按 Enter 送出、Shift+Enter 換行；注音選字時不送出
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !matchMedia("(pointer:coarse)").matches) {
    e.preventDefault(); sendText(false);
  }
});
function autoGrow() { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; }
input.addEventListener("input", autoGrow);

// 貼圖：上面是分類分頁，下面是貼圖
const stk = $("stickers");
let stkTab = null;
function recentStk() { try { return JSON.parse(localStorage.getItem("recentStk") || "[]"); } catch { return []; } }
function pushRecent(id) {
  try { const r = recentStk().filter(x => x !== id); r.unshift(id); localStorage.setItem("recentStk", JSON.stringify(r.slice(0, 16))); } catch {}
}
function drawStickers() {
  const byId = new Map(customStk.map(c => [c.id, c]));
  const groups = new Map();
  customStk.forEach(c => { const k = c.set || "我的貼圖"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(c); });
  const tabs = [];
  const recent = recentStk().map(id => byId.get(id)).filter(Boolean);
  if (recent.length) tabs.push({ name: "最近", icon: "🕘", items: recent });
  groups.forEach((items, name) => tabs.push({ name: name, img: items[0].img, items: items }));
  if (STICKERS.length) tabs.push({ name: "表情", icon: "😊", items: STICKERS });
  if (!tabs.some(t => t.name === stkTab)) { const first = tabs.find(t => t.name !== "最近") || tabs[0]; stkTab = first ? first.name : null; }

  const bar = document.createElement("div"); bar.className = "stkTabs";
  tabs.forEach(t => {
    const b = document.createElement("button");
    if (t.name === stkTab) b.className = "on";
    if (t.img) { const im = new Image(); im.src = t.img; b.append(im); } else b.append(t.icon);
    b.append(t.name);
    b.onclick = () => { stkTab = t.name; drawStickers(); };
    bar.appendChild(b);
  });
  const add = document.createElement("button");
  add.className = "add"; add.textContent = "＋ 管理";
  add.onclick = () => { stk.hidden = true; if (window.LCX) window.LCX.addSticker(); };
  bar.appendChild(add);

  const grid = document.createElement("div"); grid.className = "stkGrid";
  const cur = tabs.find(t => t.name === stkTab);
  if (!cur) {
    const p = document.createElement("p"); p.className = "stkEmpty"; p.textContent = "還沒有貼圖，按上面的「＋ 管理」上傳"; grid.appendChild(p);
  } else cur.items.forEach(c => {
    const b = document.createElement("button");
    if (typeof c === "string") { b.textContent = c; b.onclick = () => { send({ sticker: c }); stk.hidden = true; }; }
    else {
      const im = new Image(); im.src = c.img; im.loading = "lazy"; b.append(im);
      b.onclick = () => { pushRecent(c.id); send({ stkImg: c.img }); stk.hidden = true; drawStickers(); };
    }
    grid.appendChild(b);
  });
  stk.replaceChildren(bar, grid);
}
drawStickers();
$("stkBtn").onclick = () => { stk.hidden = !stk.hidden; };

// 照片和影片：照片聊天室裡放小圖，同時保留原圖；影片切塊存（上限 15 MB）；可以一次選很多張
$("file").onchange = async e => {
  const fs = Array.from(e.target.files); e.target.value = "";
  for (const f of fs) {
    if (f.type.startsWith("video/")) { if (window.LCX) await window.LCX.sendFile(f); continue; }
    try {
      toast("照片處理中…");
      const pre = await compress(f);
      const orig = window.LCX ? await window.LCX.uploadOriginal(f) : null;
      await send(orig ? { img: pre, orig: orig } : { img: pre });
    } catch { toast("這張照片讀不了"); }
  }
};
$("anyFile").onchange = e => {
  const f = e.target.files[0]; e.target.value = "";
  if (f && window.LCX) window.LCX.sendFile(f);
};
function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      let max = 1280, q = 0.75, out;
      do {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        max *= 0.8; q -= 0.05;
      } while (out.length > 700000 && max > 300);   // Firestore 每筆上限 1MB
      URL.revokeObjectURL(img.src);
      res(out);
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

$("menuBtn").onclick = () => { if (window.LCX) window.LCX.openMenu(); };

// ---------- 通話（WebRTC，兩支手機直接連線） ----------
const ICE = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }].concat(TURN_SERVERS) };
let call = null;
const cv = $("call");

function openCallUI(video, status, isIncoming) {
  cv.className = video ? "video" : "audio";
  $("callStatus").textContent = status;
  $("callTimer").textContent = "";
  $("acceptBtn").hidden = !isIncoming;
  $("muteBtn").hidden = isIncoming;
  $("camBtn").hidden = isIncoming || !video;
  $("muteBtn").classList.remove("off"); $("camBtn").classList.remove("off");
  cv.hidden = false;
}

function getMedia(video) {
  return navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true },
    video: video ? { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } : false
  });
}

function setupPC(c, role) {
  const pc = new RTCPeerConnection(ICE);
  const mine = collection(db, "calls", c.id, role === "caller" ? "callerCandidates" : "calleeCandidates");
  const theirs = collection(db, "calls", c.id, role === "caller" ? "calleeCandidates" : "callerCandidates");
  pc.onicecandidate = e => { if (e.candidate) addDoc(mine, e.candidate.toJSON()).catch(() => {}); };
  pc.ontrack = e => { $("remoteV").srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === "connected") { $("callStatus").textContent = "和" + who("") + "通話中"; startTimer(c); }
    if (pc.connectionState === "failed") hangup("連不上，可能是網路限制");
  };
  // 對方的連線資訊可能比 offer/answer 早到，先排隊
  const pending = [];
  c.flush = () => pending.splice(0).forEach(x => pc.addIceCandidate(x).catch(() => {}));
  c.unsubs.push(onSnapshot(theirs, s => s.docChanges().forEach(ch => {
    if (ch.type !== "added") return;
    const x = new RTCIceCandidate(ch.doc.data());
    if (pc.remoteDescription) pc.addIceCandidate(x).catch(() => {}); else pending.push(x);
  })));
  c.local.getTracks().forEach(t => pc.addTrack(t, c.local));
  $("localV").srcObject = c.local;
  return pc;
}

// 打電話
async function startCall(video) {
  if (call) return;
  let local;
  try { local = await getMedia(video); } catch { toast("需要麥克風" + (video ? "和鏡頭" : "") + "權限"); return; }
  const ref = doc(collection(db, "calls"));
  const c = call = { id: ref.id, ref: ref, unsubs: [], local: local, role: "caller" };
  openCallUI(video, "撥給" + who("") + "…", false);
  const pc = c.pc = setupPC(c, "caller");
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await setDoc(ref, { from: me.uid, video: video, status: "ringing", ts: Date.now(), offer: { type: offer.type, sdp: offer.sdp } });
  send({ text: video ? "📹 視訊通話" : "📞 語音通話" }, { noReply: true });
  c.unsubs.push(onSnapshot(ref, async s => {
    const d = s.data();
    if (!d || call !== c) return;
    if (d.answer && !pc.currentRemoteDescription) {
      $("callStatus").textContent = "連線中…";
      await pc.setRemoteDescription(d.answer); c.flush();
    }
    if (d.status === "ended") endLocal(d.reason);
  }));
  c.noAnswer = setTimeout(() => { if (call === c && !pc.currentRemoteDescription) hangup("對方沒有接聽"); }, 45000);
}

// 來電
function incoming(id, d) {
  call = { id: id, ref: doc(db, "calls", id), unsubs: [], role: "incoming", data: d };
  openCallUI(d.video, who(d.from) + (d.video ? " 的視訊來電 💕" : " 的語音來電 💕"), true);
  ring();
}

async function accept() {
  const c = call;
  if (!c || c.role !== "incoming") return;
  stopRing();
  c.role = "callee";
  try { c.local = await getMedia(c.data.video); } catch { hangup("需要麥克風/鏡頭權限"); return; }
  openCallUI(c.data.video, "連線中…", false);
  const pc = c.pc = setupPC(c, "callee");
  await pc.setRemoteDescription(c.data.offer); c.flush();
  const ans = await pc.createAnswer();
  await pc.setLocalDescription(ans);
  await updateDoc(c.ref, { answer: { type: ans.type, sdp: ans.sdp }, status: "active" });
  c.unsubs.push(onSnapshot(c.ref, s => { const d = s.data(); if (d && d.status === "ended") endLocal(d.reason); }));
}

function hangup(reason) {
  if (!call) return;
  const why = reason || (call.role === "incoming" ? "已拒接" : "通話結束");
  updateDoc(call.ref, { status: "ended", reason: why }).catch(() => {});
  endLocal(why);
}

function endLocal(reason) {
  if (!call) return;
  const c = call; call = null;
  clearTimeout(c.noAnswer); clearInterval(c.timer);
  c.unsubs.forEach(u => u());
  if (c.pc) c.pc.close();
  if (c.local) c.local.getTracks().forEach(t => t.stop());
  $("remoteV").srcObject = null; $("localV").srcObject = null;
  stopRing();
  cv.hidden = true;
  if (reason) toast(reason);
}

function startTimer(c) {
  if (c.timer) return;
  const t0 = Date.now();
  c.timer = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    $("callTimer").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }, 1000);
}

// 鈴聲和新訊息提示音（手機要先點過畫面一次才會響）
let actx = null, ringIv = null;
document.addEventListener("pointerdown", () => {
  try { if (!actx) actx = new AudioContext(); actx.resume(); } catch {}
});
function tone(freq, len, vol) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.value = freq; g.gain.value = vol;
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + len);
}
function ring() {
  const beep = () => { if (navigator.vibrate) navigator.vibrate([400, 200, 400]); tone(880, 0.5, 0.15); };
  beep(); ringIv = setInterval(beep, 1500);
}
function stopRing() { clearInterval(ringIv); if (navigator.vibrate) navigator.vibrate(0); }
function chime() {
  if (navigator.vibrate) navigator.vibrate(60);
  tone(1046, 0.12, 0.08);
  setTimeout(() => tone(1318, 0.15, 0.08), 120);
}

// 打電話前先確認，避免誤觸
$("callA").onclick = () => confirmBox("要和" + who("") + "語音通話嗎？", "📞 撥打", () => startCall(false));
$("callV").onclick = () => confirmBox("要和" + who("") + "視訊通話嗎？", "📹 撥打", () => startCall(true));
$("acceptBtn").onclick = accept;
$("hangBtn").onclick = () => hangup();
$("muteBtn").onclick = () => {
  const t = call && call.local && call.local.getAudioTracks()[0]; if (!t) return;
  t.enabled = !t.enabled; $("muteBtn").classList.toggle("off", !t.enabled);
};
$("camBtn").onclick = () => {
  const t = call && call.local && call.local.getVideoTracks()[0]; if (!t) return;
  t.enabled = !t.enabled; $("camBtn").classList.toggle("off", !t.enabled);
};
addEventListener("pagehide", () => hangup());

// 給 extras.js（選單和各種功能）用
window.LC = {
  db: db, list: list, els: els, msgs: msgs, hidden: hidden, COLORS: COLORS,
  get me() { return me; },
  get start() { return startDate; },
  get nick() { return nick; },
  send: send, toast: toast, confirmBox: confirmBox, compress: compress, view: view,
  preview: preview, who: who, setReply: setReply, applyColor: applyColor, showDays: showDays,
  get bg() { return bgData; }, get bgFade() { return bgFade; }, applyBg: applyBg,
  getToken: () => auth.currentUser ? auth.currentUser.getIdToken() : Promise.reject(new Error("not signed in")),
  signOut: () => signOut(auth)
};
// 背景接收通知用
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
